name: Windows build and OCR checks
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'packaging/**'
      - 'tests/**'
      - 'static/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-windows-build.txt
      - name: Prepare verified offline OCR assets
        run: python packaging/prepare_ocr_assets.py
      - name: Test the application and OCR
        run: python -m pytest -q --junitxml=build/native-results.xml
      - name: Report native test failures
        if: always()
        run: python packaging/report_native_tests.py
      - name: Build Windows executable
        shell: pwsh
        run: |
          $staticPath = Join-Path (Get-Location) 'static'
          $ocrPath = Join-Path (Get-Location) 'ocr_assets'
          python -m PyInstaller --clean --noconfirm --onefile --console --name ExamGen --add-data "${staticPath};static" --add-data "${ocrPath};ocr_assets" --distpath dist/windows --workpath build/windows --specpath build desktop.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Test the packaged executable on Windows
        run: python packaging/smoke_windows_exe.py dist/windows/ExamGen.exe
      - name: Package tested native Windows build
        run: python packaging/package_windows.py dist/windows/ExamGen.exe downloads/ExamGen-Windows-x64.zip
      - name: Save the tested build on its own branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/ExamGen-Windows-x64.zip downloads/SHA256SUMS.txt
          git commit -m 'Package verified native Windows executable'
          if ($LASTEXITCODE -ne 0) { throw 'Artifact commit failed.' }
          git push origin "HEAD:refs/heads/windows-builds/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact branch push failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ExamGen-native-Windows-x64
          path: downloads/ExamGen-Windows-x64.zip
  vision-model:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install -r requirements-dev.txt
      - name: Run real local vision model on CPU
        run: python packaging/smoke_real_vision.py
      - uses: actions/upload-artifact@v4
        with:
          name: Local-vision-smoke-report
          path: build/local-vision-smoke.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Local-vision-smoke-diagnostics
          path: build/ollama-smoke/server.log
